name: verify

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    name: typecheck + unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm test

  smoke:
    name: end-to-end in real Chrome
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run build

      # NODE_ENV matters: without it the server mounts Vite in middleware mode and
      # serves source, so the smoke test would pass against something no visitor
      # ever receives. See `isProduction` in server/config.ts.
      #
      # No GEMINI_API_KEY is set, which puts the server in bring-your-own-key mode.
      # That is the default and what the smoke test expects.
      - name: Start the production server
        run: |
          NODE_ENV=production node dist/server.cjs &
          for attempt in $(seq 1 30); do
            if curl -sf http://localhost:3000 > /dev/null; then
              echo "server up after ${attempt}s"
              exit 0
            fi
            sleep 1
          done
          echo "server never answered on :3000" >&2
          exit 1

      # ubuntu-latest ships Chrome at /usr/bin/google-chrome, which findChrome()
      # in scripts/smoke.mjs looks for. This is the check that would have caught
      # the pdf.js `toHex` failure: the app could not open a single PDF on any
      # browser older than Chrome 140 while every unit test stayed green.
      - run: npm run smoke

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-screenshots
          path: .tmp/smoke/
          if-no-files-found: warn
