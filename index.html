<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
    <title>PDF Explainer — Understand your lecture slides</title>
    <meta
      name="description"
      content="Turn lecture slide PDFs into a calm study workspace: slide-by-slide explanations, a slide-aware tutor, and active recall practice."
    />
    <!--
      The link preview: what Slack, iMessage and LinkedIn show when somebody
      pastes a link here. Without these they show a bare URL, which is what this
      app had until now.

      The description is the same sentence as the meta description above, on
      purpose. Two descriptions of one app are two things to keep true, and the
      second one always rots first.

      `og:image` is /og.png, regenerated by `npm run og` from the bundled demo
      deck in a real browser, so it changes when the app does. The absolute URLs
      are required — a crawler resolves these against nothing — which is why
      `securityHeaders.test.ts` excludes the canonical link from its
      "nothing cross-origin" check: it names this page's own address and fetches
      nothing. `tests/socialCard.test.ts` keeps the rest of it honest.
    -->
    <link rel="canonical" href="https://pdf-explainer.xiangli3625.workers.dev/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="PDF Explainer" />
    <meta property="og:title" content="PDF Explainer — Understand your lecture slides" />
    <meta
      property="og:description"
      content="Turn lecture slide PDFs into a calm study workspace: slide-by-slide explanations, a slide-aware tutor, and active recall practice."
    />
    <meta property="og:url" content="https://pdf-explainer.xiangli3625.workers.dev/" />
    <meta property="og:image" content="https://pdf-explainer.xiangli3625.workers.dev/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="The study workspace open on the bundled demo lecture: slide thumbnails, the slide itself, and its notes in a panel alongside the Ask and Review tabs."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="PDF Explainer — Understand your lecture slides" />
    <meta
      name="twitter:description"
      content="Turn lecture slide PDFs into a calm study workspace: slide-by-slide explanations, a slide-aware tutor, and active recall practice."
    />
    <meta name="twitter:image" content="https://pdf-explainer.xiangli3625.workers.dev/og.png" />

    <!--
      These were two 964 KB JPEGs, byte-identical to each other, and neither was a
      JPEG: 67% of each file was U+FFFD, the replacement character, so the image
      had been read as UTF-8 text and written back out. There was no icon to
      recover and there never had been one on screen -- just 1.9 MB shipped in
      every build to render nothing. Redrawn as an SVG, with a PNG for the
      consumers that want a raster. Together they are 4.3 KB.
    -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!--
      Applies the saved appearance before first paint. A file rather than an
      inline block so that `script-src 'self'` covers it without a hash — see
      public/theme.js and server/headers.ts.
    -->
    <script src="/theme.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
